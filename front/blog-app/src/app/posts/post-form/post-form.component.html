<form [formGroup]="form" (ngSubmit)="onSubmit()" class="post-form" novalidate>
  <div
    class="form-group"
    [class.has-error]="form.controls.title.touched && form.controls.title.invalid"
  >
    <label for="post-title" class="form-label">Title</label>
    <input
      id="post-title"
      type="text"
      formControlName="title"
      class="form-input"
      placeholder="Enter post title..."
      [disabled]="submitting"
      maxlength="255"
    />
    <div class="input-footer">
      <div class="form-errors">
        <span
          class="form-error"
          *ngIf="form.controls.title.touched && form.controls.title.errors?.['required']"
        >
          Title is required
        </span>
        <span
          class="form-error"
          *ngIf="form.controls.title.touched && form.controls.title.errors?.['minlength']"
        >
          Title must be at least 1 character
        </span>
        <span
          class="form-error"
          *ngIf="form.controls.title.touched && form.controls.title.errors?.['maxlength']"
        >
          Title is too long
        </span>
      </div>
      <span class="char-count" [class.low]="titleRemaining < 30">
        {{ titleRemaining }} left
      </span>
    </div>
  </div>

  <div
    class="form-group"
    [class.has-error]="form.controls.content.touched && form.controls.content.invalid"
  >
    <label for="post-content" class="form-label">Content</label>
    <textarea
      id="post-content"
      formControlName="content"
      class="form-textarea"
      rows="12"
      placeholder="Write your post content here... (minimum 10 characters)"
      [disabled]="submitting"
      maxlength="5000"
    ></textarea>
    <div class="input-footer">
      <div class="form-errors">
        <span
          class="form-error"
          *ngIf="form.controls.content.touched && form.controls.content.errors?.['required']"
        >
          Content is required
        </span>
        <span
          class="form-error"
          *ngIf="form.controls.content.touched && form.controls.content.errors?.['minlength']"
        >
          Content must be at least 10 characters
        </span>
        <span
          class="form-error"
          *ngIf="form.controls.content.touched && form.controls.content.errors?.['maxlength']"
        >
          Content is too long
        </span>
      </div>
      <span class="char-count" [class.low]="contentRemaining < 200">
        {{ contentRemaining }} left
      </span>
    </div>
  </div>

  <div class="form-group">
    <label for="post-media" class="form-label">
      <ng-icon name="lucidePaperclip" size="16"></ng-icon>
      <span>Upload Media</span>
      <span class="label-hint">(Max 50MB per file)</span>
    </label>
    <input
      id="post-media"
      type="file"
      class="file-input"
      multiple
      accept="image/*,video/*"
      (change)="onFilesSelected($event)"
      [disabled]="submitting"
    />

    <div class="media-preview" *ngIf="existingMediaUrls.length > 0 || selectedFiles.length > 0">
      <div
        class="media-item existing"
        *ngFor="let url of existingMediaUrls; let i = index"
      >
        <img [src]="url" alt="Existing media" loading="lazy" />
        <button
          type="button"
          class="media-remove"
          (click)="onRemoveExistingMedia(i)"
          [disabled]="submitting"
          aria-label="Remove media"
        >
          <ng-icon name="lucideX" size="16"></ng-icon>
        </button>
        <span class="media-badge">Existing</span>
      </div>

      <div
        class="media-item"
        *ngFor="let file of selectedFiles; let i = index"
      >
        <div class="media-placeholder">
          <ng-icon name="lucideFileUp" size="24"></ng-icon>
          <span class="file-name">{{ file.name }}</span>
          <span class="file-size">{{ formatFileSize(file.size) }}</span>
        </div>
        <button
          type="button"
          class="media-remove"
          (click)="onRemoveFile(i)"
          [disabled]="submitting"
          aria-label="Remove file"
        >
          <ng-icon name="lucideX" size="16"></ng-icon>
        </button>
      </div>
    </div>
  </div>

  <div class="form-group checkbox-group">
    <label class="checkbox-label">
      <input
        type="checkbox"
        formControlName="published"
        [disabled]="submitting"
      />
      <span class="checkbox-custom"></span>
      <span class="checkbox-text">
        Publish immediately
        <span class="checkbox-hint" *ngIf="!form.controls.published.value">(will be saved as draft)</span>
      </span>
    </label>
  </div>

  <div class="form-actions">
    <button
      type="button"
      class="btn-cancel"
      (click)="onCancelClick()"
      [disabled]="submitting"
    >
      Cancel
    </button>
    <button
      type="submit"
      class="btn-submit"
      [disabled]="form.invalid || submitting"
    >
      <span *ngIf="!submitting">{{ submitLabel }}</span>
      <ng-icon name="lucideLoader" size="16" class="spin" *ngIf="submitting"></ng-icon>
    </button>
  </div>
</form>
