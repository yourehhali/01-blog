<div class="alert-list">
  @for (alert of alerts$ | async; track alert) {
    <div
      class="alert alert-dismissible fade show d-flex align-items-center"
      [ngClass]="getClass(alert.type)"
      role="alert"
      >
      @switch (alert.type) {
        @case ('success') {
          <ng-icon name="lucideCircleCheck" size="18"></ng-icon>
        }
        @case ('danger') {
          <ng-icon name="lucideCircleX" size="18"></ng-icon>
        }
        @case ('error') {
          <ng-icon name="lucideCircleX" size="18"></ng-icon>
        }
        @case ('info') {
          <ng-icon name="lucideInfo" size="18"></ng-icon>
        }
        @case ('warning') {
          <ng-icon name="lucideTriangleAlert" size="18"></ng-icon>
        }
        @default {
          <ng-icon name="lucideMessageSquare" size="18"></ng-icon>
        }
      }
      <span class="ms-2 flex-grow-1">{{ alert.message }}</span>
      <button
        type="button"
        class="btn-close ms-2"
        aria-label="Close"
        (click)="dismiss(alert.id)"
      ></button>
    </div>
  }
</div>
