<nav aria-label="Page navigation" *ngIf="page && page.totalPages > 1">
  <ul class="pagination justify-content-center mb-0">
    <li class="page-item" [class.disabled]="page.first">
      <a class="page-link" href="javascript:void(0)" (click)="onPageChange(0)" aria-label="First">
        <ng-icon name="lucideChevronsLeft" size="16"></ng-icon>
      </a>
    </li>
    <li class="page-item" [class.disabled]="page.first">
      <a class="page-link" href="javascript:void(0)" (click)="onPageChange(page.number - 1)" aria-label="Previous">
        <ng-icon name="lucideChevronLeft" size="16"></ng-icon>
      </a>
    </li>
    <li
      class="page-item"
      *ngFor="let p of pages"
      [class.active]="p !== '...' && p === page.number"
      [class.disabled]="p === '...'"
    >
      <a class="page-link" href="javascript:void(0)" *ngIf="p !== '...'" (click)="onPageChange(p)">
        {{ p + 1 }}
      </a>
      <span class="page-link" *ngIf="p === '...'">...</span>
    </li>
    <li class="page-item" [class.disabled]="page.last">
      <a class="page-link" href="javascript:void(0)" (click)="onPageChange(page.number + 1)" aria-label="Next">
        <ng-icon name="lucideChevronRight" size="16"></ng-icon>
      </a>
    </li>
    <li class="page-item" [class.disabled]="page.last">
      <a class="page-link" href="javascript:void(0)" (click)="onPageChange(page.totalPages - 1)" aria-label="Last">
        <ng-icon name="lucideChevronsRight" size="16"></ng-icon>
      </a>
    </li>
  </ul>
</nav>
