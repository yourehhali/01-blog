spring.application.name=main

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/blog}
spring.datasource.username=${DB_USER:bloguser}
spring.datasource.password=${DB_PASSWORD:blogpassword}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

jwt.secret=${JWT_SECRET:change-me-change-me-change-me-change-me}
jwt.expiration-ms=${JWT_EXPIRATION:3600000}
jwt.refresh.expiration-ms=${JWT_REFRESH_EXPIRATION:604800000}

app.base-url=${APP_BASE_URL:http://localhost:8080}
app.media.path=${APP_MEDIA_PATH:uploads}

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
